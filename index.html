<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pega Frutas</title>
  <style>
    :root {
      --ink: #24343c;
      --panel: rgba(255, 255, 255, 0.94);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #152228;
      color: var(--ink);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #wrap {
      width: min(440px, 100vw);
      height: min(760px, 100dvh);
      position: relative;
      overflow: hidden;
      background: linear-gradient(#8fd4f0 0%, #7ec8e3 48%, #c8e9a8 74%, #6fbf73 74%);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.4);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      z-index: 2;
      pointer-events: none;
    }

    .pill {
      background: var(--panel);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      white-space: nowrap;
    }

    .hud-right {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: var(--panel);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      cursor: pointer;
      font-size: 18px;
      display: grid;
      place-items: center;
    }

    .combo {
      position: absolute;
      top: 62px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 3px 0 rgba(0, 0, 0, 0.18);
      opacity: 0;
      transform: scale(0.8);
      transition: 0.15s;
      pointer-events: none;
      z-index: 2;
    }

    .combo.show {
      opacity: 1;
      transform: scale(1);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(18, 36, 46, 0.32);
      backdrop-filter: blur(4px);
      z-index: 4;
      padding: 20px;
      text-align: center;
    }

    .overlay.hidden { display: none; }

    .card {
      background: var(--panel);
      border-radius: 28px;
      padding: 26px 20px 22px;
      width: min(340px, 94%);
      box-shadow: 0 14px 0 rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 32px;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .subtitle, .hint { color: #4d6670; font-size: 15px; }
    .subtitle { margin-bottom: 10px; }
    .hint { margin-top: 8px; font-size: 13px; }
    .score-big { font-size: 48px; margin: 6px 0 2px; }

    .howto {
      display: grid;
      gap: 6px;
      text-align: left;
      margin: 14px 0 4px;
      font-size: 14px;
    }

    button.main {
      margin-top: 16px;
      border: 0;
      background: #ff8a3d;
      color: #fff;
      font-size: 20px;
      font-weight: 800;
      padding: 13px 28px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 #d66a22;
      font-family: inherit;
    }

    button.main:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #d66a22;
    }

    .paused-title { font-size: 28px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="hud">
      <div>
        <div class="pill" id="scorePill">Pontos: 0</div>
      </div>
      <div class="hud-right">
        <div class="pill" id="livesPill">❤️❤️❤️</div>
        <button class="icon-btn" id="soundBtn" title="Som">🔊</button>
        <button class="icon-btn" id="pauseBtn" title="Pausar">⏸️</button>
      </div>
    </div>
    <div class="combo" id="comboText"></div>
    <canvas id="game"></canvas>

    <div class="overlay" id="startScreen">
      <div class="card">
        <h1>🍎 Pega Frutas</h1>
        <p class="subtitle">Fácil de jogar. Difícil de largar.</p>
        <div class="howto">
          <div>🍎🍌🍓 Pegue as frutas</div>
          <div>🪨 Desvie das pedras</div>
          <div>💛 Coração dá vida extra</div>
          <div>⭐ Estrela vale muitos pontos</div>
        </div>
        <p class="hint">Setas, A/D ou arraste o dedo</p>
        <button class="main" id="startBtn">Jogar</button>
      </div>
    </div>

    <div class="overlay hidden" id="pauseScreen">
      <div class="card">
        <div class="paused-title">⏸️ Pausado</div>
        <p class="hint">O jogo está parado</p>
        <button class="main" id="resumeBtn">Continuar</button>
      </div>
    </div>

    <div class="overlay hidden" id="overScreen">
      <div class="card">
        <h1>Fim de jogo</h1>
        <div class="score-big" id="finalScore">0</div>
        <p>Melhor combo: <strong id="bestCombo">0</strong></p>
        <p>Recorde: <strong id="bestScore">0</strong></p>
        <button class="main" id="againBtn">Jogar de novo</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const wrap = document.getElementById("wrap");
    const scorePill = document.getElementById("scorePill");
    const livesPill = document.getElementById("livesPill");
    const comboText = document.getElementById("comboText");
    const startScreen = document.getElementById("startScreen");
    const pauseScreen = document.getElementById("pauseScreen");
    const overScreen = document.getElementById("overScreen");
    const soundBtn = document.getElementById("soundBtn");
    const pauseBtn = document.getElementById("pauseBtn");

    const FRUITS = ["🍎", "🍌", "🍇", "🍓", "🍊", "🍉", "🍒", "🥝", "🍑"];

    let W = 0, H = 0, dpr = 1;
    let running = false, paused = false, muted = false;
    let score = 0, lives = 3, combo = 0, maxCombo = 0;
    let basketX = 0.5, basketTarget = 0.5;
    let items = [], pops = [], parts = [], clouds = [];
    let spawnTimer = 0, last = 0, shake = 0, time = 0;
    let keys = { left: false, right: false };
    let audioCtx = null;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = wrap.clientWidth;
      H = wrap.clientHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function getBest() {
      return Number(localStorage.getItem("pegaFrutasBest") || 0);
    }
    function saveBest() {
      if (score > getBest()) localStorage.setItem("pegaFrutasBest", String(score));
    }

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function beep(freq, dur, type, vol, slide) {
      if (muted || !audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    }

    function sfx(kind) {
      if (kind === "catch") beep(520 + combo * 20, 0.12, "triangle", 0.07, 740);
      if (kind === "star") { beep(660, 0.1, "sine", 0.07, 880); setTimeout(() => beep(990, 0.16, "sine", 0.06), 80); }
      if (kind === "heart") beep(420, 0.18, "sine", 0.07, 680);
      if (kind === "bad") beep(180, 0.22, "square", 0.05, 90);
      if (kind === "miss") beep(240, 0.14, "sawtooth", 0.03, 120);
      if (kind === "over") { beep(300, 0.2, "triangle", 0.06, 160); setTimeout(() => beep(180, 0.35, "triangle", 0.05, 90), 160); }
      if (kind === "start") beep(400, 0.1, "sine", 0.05, 640);
    }

    function reset() {
      score = 0; lives = 3; combo = 0; maxCombo = 0;
      items = []; pops = []; parts = [];
      spawnTimer = 0.2; basketX = 0.5; basketTarget = 0.5; shake = 0; time = 0;
      updateHud();
      showCombo(false);
    }

    function updateHud() {
      scorePill.textContent = "Pontos: " + score;
      livesPill.textContent = "❤️".repeat(Math.max(0, lives)) + "🤍".repeat(Math.max(0, 3 - lives));
    }

    function showCombo(on) {
      if (on && combo >= 3) {
        comboText.textContent = "Combo x" + combo + "!";
        comboText.classList.add("show");
      } else {
        comboText.classList.remove("show");
      }
    }

    function makeClouds() {
      clouds = [];
      for (let i = 0; i < 5; i++) {
        clouds.push({
          x: Math.random(),
          y: 0.06 + Math.random() * 0.28,
          s: 50 + Math.random() * 70,
          v: 0.01 + Math.random() * 0.02
        });
      }
    }

    function spawn() {
      const r = Math.random();
      let kind = "fruit";
      if (r < 0.16) kind = "rock";
      else if (r < 0.19) kind = "star";
      else if (r < 0.215 && lives < 3) kind = "heart";

      const emoji = kind === "rock" ? "🪨" : kind === "star" ? "⭐" : kind === "heart" ? "💛" :
        FRUITS[Math.floor(Math.random() * FRUITS.length)];

      items.push({
        x: 0.12 + Math.random() * 0.76,
        y: -0.08,
        speed: 0.17 + Math.min(score / 280, 0.32) + Math.random() * 0.07,
        emoji, kind,
        rot: (Math.random() - 0.5) * 0.9,
        size: kind === "rock" ? 34 : 40,
        wobble: Math.random() * 6
      });
    }

    function burst(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 40 + Math.random() * 90;
        parts.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp - 30,
          life: 0.45 + Math.random() * 0.25,
          max: 0.7,
          color,
          r: 2 + Math.random() * 3
        });
      }
    }

    function popup(x, y, text, color) {
      pops.push({ x, y, text, color, life: 0.8 });
    }

    function basketRect() {
      const bw = 100, bh = 40;
      return { x: basketX * W - bw / 2, y: H * 0.815, w: bw, h: bh };
    }

    function endGame() {
      running = false;
      paused = false;
      saveBest();
      sfx("over");
      document.getElementById("finalScore").textContent = score;
      document.getElementById("bestScore").textContent = getBest();
      document.getElementById("bestCombo").textContent = maxCombo;
      overScreen.classList.remove("hidden");
      pauseScreen.classList.add("hidden");
    }

    function update(dt) {
      time += dt;
      shake = Math.max(0, shake - dt * 3);

      const move = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
      if (move) basketTarget += move * dt * 1.4;
      basketTarget = Math.max(0.13, Math.min(0.87, basketTarget));
      basketX += (basketTarget - basketX) * Math.min(1, dt * 14);

      const rate = Math.max(0.32, 0.88 - score / 520);
      spawnTimer += dt;
      if (spawnTimer > rate) {
        spawnTimer = 0;
        spawn();
        if (score > 120 && Math.random() < 0.22) spawn();
      }

      const b = basketRect();
      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.speed * dt;
        it.rot += dt * 1.8;
        const ix = it.x * W + Math.sin(time * 3 + it.wobble) * 6;
        const iy = it.y * H;

        const caught = ix > b.x - 6 && ix < b.x + b.w + 6 && iy > b.y - 8 && iy < b.y + b.h + 18;
        if (caught) {
          const cx = ix, cy = b.y;
          if (it.kind === "rock") {
            lives -= 1; combo = 0; shake = 0.45;
            sfx("bad"); burst(cx, cy, "#8a7a6a", 14);
            popup(cx, cy - 10, "Ai!", "#c0392b");
            showCombo(false);
          } else if (it.kind === "heart") {
            lives = Math.min(3, lives + 1);
            sfx("heart"); burst(cx, cy, "#ff6b8a", 16);
            popup(cx, cy - 10, "+vida", "#e74c7a");
          } else if (it.kind === "star") {
            combo += 1; maxCombo = Math.max(maxCombo, combo);
            const add = 50 + combo * 5;
            score += add;
            sfx("star"); burst(cx, cy, "#ffd24a", 20);
            popup(cx, cy - 10, "+" + add, "#f39c12");
            showCombo(true);
          } else {
            combo += 1; maxCombo = Math.max(maxCombo, combo);
            const add = 10 + Math.min(combo, 10) * 2;
            score += add;
            sfx("catch"); burst(cx, cy, "#7bed9f", 12);
            popup(cx, cy - 10, "+" + add, "#27ae60");
            showCombo(true);
          }
          items.splice(i, 1);
          updateHud();
          if (lives <= 0) endGame();
          continue;
        }

        if (it.y > 1.1) {
          if (it.kind === "fruit") {
            lives -= 1; combo = 0; shake = 0.25;
            sfx("miss");
            popup(it.x * W, H * 0.78, "ops", "#c0392b");
            showCombo(false);
            updateHud();
            if (lives <= 0) endGame();
          }
          items.splice(i, 1);
        }
      }

      for (let i = pops.length - 1; i >= 0; i--) {
        pops[i].life -= dt;
        pops[i].y -= 50 * dt;
        if (pops[i].life <= 0) pops.splice(i, 1);
      }
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 180 * dt;
        if (p.life <= 0) parts.splice(i, 1);
      }
      clouds.forEach(c => {
        c.x += c.v * dt * 0.15;
        if (c.x > 1.2) c.x = -0.25;
      });
    }

    function drawSky() {
      clouds.forEach(c => {
        const x = c.x * W, y = c.y * H, s = c.s;
        ctx.fillStyle = "rgba(255,255,255,0.78)";
        ctx.beginPath();
        ctx.ellipse(x, y, s * 0.55, s * 0.22, 0, 0, Math.PI * 2);
        ctx.ellipse(x - s * 0.25, y + 4, s * 0.28, s * 0.16, 0, 0, Math.PI * 2);
        ctx.ellipse(x + s * 0.28, y + 2, s * 0.3, s * 0.17, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawGrass() {
      const y = H * 0.74;
      const g = ctx.createLinearGradient(0, y, 0, H);
      g.addColorStop(0, "#7ed36f");
      g.addColorStop(1, "#4ea352");
      ctx.fillStyle = g;
      ctx.fillRect(0, y, W, H - y);
      ctx.fillStyle = "#62b85c";
      ctx.fillRect(0, y, W, 8);
      ctx.fillStyle = "#57a352";
      for (let i = -1; i < 20; i++) {
        const x = i * 28 + (time * 8 % 28);
        ctx.beginPath();
        ctx.moveTo(x, y + 8);
        ctx.quadraticCurveTo(x + 10, y - 12, x + 20, y + 8);
        ctx.fill();
      }
    }

    function drawBasket() {
      const b = basketRect();
      ctx.save();
      ctx.translate(b.x + b.w / 2, b.y + 10);
      ctx.fillStyle = "rgba(0,0,0,0.12)";
      ctx.beginPath();
      ctx.ellipse(0, 28, 40, 7, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#c9843f";
      ctx.strokeStyle = "#6b3e16";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-48, -8);
      ctx.quadraticCurveTo(0, 40, 48, -8);
      ctx.lineTo(40, -20);
      ctx.quadraticCurveTo(0, 18, -40, -20);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = "#e2b27a";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(0, -26, 28, Math.PI * 0.92, Math.PI * 0.08, true);
      ctx.stroke();

      ctx.strokeStyle = "#a35d24";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-22, -6); ctx.quadraticCurveTo(0, 20, 22, -6);
      ctx.stroke();
      ctx.restore();
    }

    function drawItems() {
      items.forEach(it => {
        const x = it.x * W + Math.sin(time * 3 + it.wobble) * 6;
        const y = it.y * H;
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.12)";
        ctx.beginPath();
        ctx.ellipse(x, y + 16, 12, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.translate(x, y);
        ctx.rotate(it.rot * 0.22);
        ctx.font = it.size + "px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(it.emoji, 0, 0);
        ctx.restore();
      });
    }

    function drawFx() {
      parts.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / p.max);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
      pops.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life / 0.8);
        ctx.fillStyle = p.color;
        ctx.font = "bold 18px Trebuchet MS, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(p.text, p.x, p.y);
      });
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
      }
      ctx.clearRect(-20, -20, W + 40, H + 40);
      drawSky();
      drawGrass();
      drawItems();
      drawBasket();
      drawFx();
      ctx.restore();
    }

    function loop(t) {
      if (!running) return;
      const dt = Math.min((t - last) / 1000, 0.033);
      last = t;
      if (!paused) update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function startGame() {
      ensureAudio();
      sfx("start");
      reset();
      startScreen.classList.add("hidden");
      overScreen.classList.add("hidden");
      pauseScreen.classList.add("hidden");
      running = true; paused = false;
      last = performance.now();
      requestAnimationFrame(loop);
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseScreen.classList.toggle("hidden", !paused);
    }

    function pointerToX(clientX) {
      const rect = wrap.getBoundingClientRect();
      basketTarget = (clientX - rect.left) / rect.width;
      basketTarget = Math.max(0.13, Math.min(0.87, basketTarget));
    }

    window.addEventListener("resize", resize);
    resize();
    makeClouds();
    document.getElementById("bestScore").textContent = getBest();
    draw();

    document.getElementById("startBtn").onclick = startGame;
    document.getElementById("againBtn").onclick = startGame;
    document.getElementById("resumeBtn").onclick = togglePause;
    pauseBtn.onclick = togglePause;
    soundBtn.onclick = () => {
      muted = !muted;
      soundBtn.textContent = muted ? "🔇" : "🔊";
      if (!muted) ensureAudio();
    };

    window.addEventListener("keydown", (e) => {
      if (["ArrowLeft", "ArrowRight", " ", "ArrowUp", "ArrowDown"].includes(e.key)) e.preventDefault();
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
      if ((e.key === "Enter" || e.key === " ") && !running) startGame();
      if (e.key === "p" || e.key === "P" || e.key === "Escape") togglePause();
    });
    window.addEventListener("keyup", (e) => {
      if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
      if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    });

    wrap.addEventListener("pointerdown", (e) => {
      if (e.target.closest("button")) return;
      pointerToX(e.clientX);
    });
    wrap.addEventListener("pointermove", (e) => {
      if (e.buttons || e.pointerType === "touch") pointerToX(e.clientX);
    });
  </script>
</body>
</html>
